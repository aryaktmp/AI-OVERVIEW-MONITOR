# Penjadwal Pemroses Antrean untuk Tahap Uji (Vercel Hobby):
# Pada tahap uji di Vercel Hobby, cron bawaan hanya dapat berjalan sekali sehari.
# Workflow GitHub Actions ini berjalan tiap jam pada hari Senin dan Selasa (0 * * * 1,2 UTC)
# serta dapat dipicu manual lewat workflow_dispatch.
# Setiap eksekusi memanggil /api/cron/process berulang kali dengan jeda 20 detik sampai
# pending = 0, batas laju per jam (rate_limit) tercapai, atau batas waktu 10 menit habis.
#
# CATATAN MIGRASI VPS:
# Saat aplikasi dipindahkan ke VPS sendiri, workflow GitHub Actions ini tidak lagi diperlukan
# dan digantikan langsung oleh cron sistem (crontab / systemd timer) di VPS yang memanggil
# endpoint HTTP /api/cron/start-run dan /api/cron/process dengan header Bearer CRON_SECRET.

name: Proses Antrean AI Overview

on:
  schedule:
    - cron: "0 * * * 1,2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: process-ai-overview-queue
  cancel-in-progress: false

jobs:
  process-queue:
    name: Kuras antrean /api/cron/process (maks 10 menit)
    if: ${{ vars.ENABLE_QUEUE_WORKFLOW != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - name: Panggil /api/cron/process berulang hingga selesai atau batas laju
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set +x
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Secret APP_URL atau CRON_SECRET belum diatur di GitHub Repository Secrets. Melewati eksekusi."
            exit 0
          fi

          TARGET_URL="${APP_URL%/}/api/cron/process"
          START_EPOCH=$(date +%s)
          MAX_SECONDS=600
          ITERATION=0

          while true; do
            NOW_EPOCH=$(date +%s)
            ELAPSED=$((NOW_EPOCH - START_EPOCH))
            if [ "$ELAPSED" -ge "$MAX_SECONDS" ]; then
              echo "Batas waktu eksekusi 10 menit (${ELAPSED}s) tercapai. Menghentikan loop."
              break
            fi

            ITERATION=$((ITERATION + 1))
            HTTP_STATUS=$(curl -sS -o /tmp/cron_response.json -w "%{http_code}" \
              -X POST "$TARGET_URL" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json")

            if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
              echo "[Iterasi $ITERATION] Pemanggilan /api/cron/process gagal dengan kode HTTP $HTTP_STATUS"
              exit 1
            fi

            PENDING=$(jq -r '.pending // 0' /tmp/cron_response.json 2>/dev/null || echo "0")
            STOPPED_REASON=$(jq -r '.stoppedReason // "unknown"' /tmp/cron_response.json 2>/dev/null || echo "unknown")
            RUN_STATUS=$(jq -r '.runStatus // "idle"' /tmp/cron_response.json 2>/dev/null || echo "idle")
            PROCESSED=$(jq -r '.processedCount // 0' /tmp/cron_response.json 2>/dev/null || echo "0")

            echo "[Iterasi $ITERATION | ${ELAPSED}s] HTTP=$HTTP_STATUSprocessed=$PROCESSED pending=$PENDING stoppedReason=$STOPPED_REASON runStatus=$RUN_STATUS"

            if [ "$PENDING" = "0" ] || [ "$STOPPED_REASON" = "queue_empty" ] || [ "$STOPPED_REASON" = "no_more_items" ]; then
              echo "Tidak ada item pending tersisa (pending=0). Selesai."
              break
            fi

            if [ "$STOPPED_REASON" = "rate_limit" ]; then
              echo "Batas laju per jam (SERPAPI_MAX_PER_HOUR) tercapai. Berhenti hingga jam berikutnya."
              break
            fi

            NOW_AFTER=$(date +%s)
            ELAPSED_AFTER=$((NOW_AFTER - START_EPOCH))
            if [ $((ELAPSED_AFTER + 20)) -ge "$MAX_SECONDS" ]; then
              echo "Sisa waktu kurang dari 20 detik sebelum batas 10 menit. Menghentikan loop."
              break
            fi

            sleep 20
          done
